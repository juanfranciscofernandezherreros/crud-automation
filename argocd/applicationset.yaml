apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: crud-repositories
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements: []
  template:
    metadata:
      name: "{{.repo}}"
      labels:
        app.kubernetes.io/managed-by: crud-repositories
    spec:
      project: default
      source:
        repoURL: "https://github.com/juanfranciscofernandezherreros/{{.repo}}.git"
        targetRevision: "{{.branch}}"
        path: k8s
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.repo}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
          - ApplyOutOfSyncOnly=true
