name: CI

# Dogfooding: el generador shipea una plantilla de CI (crud_generator/templates.py
# get_github_actions_workflow) para cada proyecto que produce, pero el propio
# repositorio crud-automation no ejecutaba su suite en cada push -- solo cuando
# alguien la corria a mano en sesion. Este workflow cierra ese hueco: corre la
# suite completa de pytest, que a su vez genera proyectos reales (CRUD en las
# tres arquitecturas, y Kafka Streams) y los compila/prueba con `mvn verify`
# (Testcontainers PostgreSQL incluido; el runner de GitHub Actions trae Docker).

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de test (pytest + jsonschema)
        run: pip install -r requirements-dev.txt

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cachear repositorio local de Maven
        uses: actions/cache@v4
        with:
          path: .m2/repository
          key: maven-repo-${{ hashFiles('crud_generator/**/*.py') }}
          restore-keys: |
            maven-repo-

      - name: pytest (unitarios + generacion y verificacion real de proyectos con mvn verify)
        run: python -m pytest -q
