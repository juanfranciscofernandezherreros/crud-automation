name: Actualizar ApplicationSet

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descubrir repositorios crud-* desplegables
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_applicationset.py

      - name: Publicar cambios
        shell: bash
        run: |
          if git diff --quiet -- argocd/applicationset.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add argocd/applicationset.yaml
          git commit -m "chore(argocd): refresh crud repositories"
          git push

