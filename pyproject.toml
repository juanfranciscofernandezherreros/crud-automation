[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crud-automation"
version = "0.1.0"
description = "Generador de microservicios Spring Boot (CRUD layered/hexagonal/clean, o un esqueleto minimo GitOps-ready) a partir de una definicion de entidad."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Juan Francisco Fernandez Herreros" }]
keywords = ["spring-boot", "code-generator", "crud", "scaffolding", "gitops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/juanfranciscofernandezherreros/crud-automation"
Repository = "https://github.com/juanfranciscofernandezherreros/crud-automation"

[project.scripts]
generate-crud = "crud_generator.cli:main"

[project.optional-dependencies]
dev = ["pytest", "jsonschema"]

[tool.setuptools.packages.find]
include = ["crud_generator*"]

[tool.setuptools.package-data]
crud_generator = ["schema/*.json"]
